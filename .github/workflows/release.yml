name: Release
on:
 push:
 tags: ["v*"]
permissions:
 contents: write
jobs:
 test:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: ./.github/actions/setup
 - run: pytest
 release:
 needs: test
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - run: zip release.zip utils.py README.md
 - name: Publish release
 env:
 GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 run: gh release create "${{ github.ref_name }}" release.zip --generate-notes
