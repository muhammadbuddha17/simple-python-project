name: Setup project
description: Install Python and the project libraries
inputs:
 python-version:
 required: false
 default: "3.12"
runs:
 using: composite
 steps:
 - uses: actions/setup-python@v5
 with:
 python-version: ${{ inputs.python-version }}
 cache: pip
 - name: Install libraries
 shell: bash
 run: pip install -r requirements.txt
